<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo 鉴权页面</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f1115; color: #e8e8ea; max-width: 720px; margin: 40px auto; padding: 0 16px; }
  .card { background: #171a21; border: 1px solid #2a2f3a; border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; }
  h1 { font-size: 18px; margin-bottom: 4px; }
  h2 { font-size: 12px; color: #9aa3b2; margin-top: 0; font-weight: normal; }
  pre { font-size: 12px; background: #0c0e12; border: 1px solid #2a2f3a; border-radius: 8px; padding: 12px; overflow: auto; }
  .ok { color: #3ecf8e; }
</style>
</head>
<body>
<h1>demo 插件 · 鉴权页面 <span class="ok">✔ 管理员已登录</span></h1>
<h2>由 ctx.pages.register({ route: '/plugin/demo/secure', file: 'lib/client/secure.html', auth: true }) 注册 —— 未登录访问会被 302 重定向到后台登录页</h2>
<div class="card"><h2>capabilities（GET /api/plugin/demo/capabilities）</h2><pre id="caps">加载中...</pre></div>
<script>
  fetch('/api/plugin/demo/capabilities').then(r => r.json()).then(d => {
    document.getElementById('caps').textContent = d.code === 0 ? JSON.stringify(d.data, null, 2) : '加载失败';
  }).catch(() => { document.getElementById('caps').textContent = '加载失败'; });
</script>
</body>
</html>
