<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenList 文件浏览</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f1115; color: #e8e8ea; max-width: 1080px; margin: 30px auto; padding: 0 16px; }
  .card { background: #171a21; border: 1px solid #2a2f3a; border-radius: 12px; padding: 14px 18px; margin-bottom: 14px; }
  h1 { font-size: 18px; margin-bottom: 4px; }
  h2 { font-size: 12px; color: #9aa3b2; font-weight: normal; margin-top: 0; }
  .crumbs { font-size: 12px; margin: 8px 0; color: #9aa3b2; word-break: break-all; }
  .crumbs a { color: #60a5fa; cursor: pointer; text-decoration: none; padding: 1px 5px; border-radius: 4px; }
  .crumbs a:hover { background: #1f2937; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #232833; }
  th { color: #9aa3b2; font-weight: normal; }
  td.name { cursor: pointer; max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.name.dir { color: #60a5fa; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 6px; padding: 3px 9px; font-size: 11px; cursor: pointer; margin: 0 3px; }
  button.gray { background: #374151; }
  .vext { display: inline-block; border: 1px solid #2a2f3a; border-radius: 4px; padding: 0 5px; font-size: 10px; color: #3ecf8e; }
  .msg { font-size: 13px; } .ok { color: #3ecf8e; } .err { color: #ef4444; } .warn { color: #f59e0b; }
</style>
</head>
<body>
<h1>openlist · 网盘文件浏览</h1>
<h2>浏览 OpenList 目录树 · 注册视频到播放库（自动触发内封字幕扫描） · 复制播放链接</h2>
<div class="card">
  <div class="crumbs" id="crumbs">/</div>
  <div style="margin:6px 0 2px">
    <button id="upBtn" class="gray" onclick="goUp()" style="display:none">⬆ 上一级</button>
    <button id="scanBtn" onclick="scanFolder()">扫描此文件夹（含子目录）</button>
    <button id="pauseBtn" class="gray" onclick="scanPauseToggle()" style="display:none">暂停</button>
    <button id="stopBtn" class="gray" onclick="scanControl('stop')" style="display:none">停止扫描</button>
    <button id="retryBtn" onclick="retryScan()" style="display:none">重试失败项</button>
    <span class="msg" id="scanStat" style="margin-left:6px"></span>
  </div>
  <div id="failList" style="display:none;margin:6px 0 0;font-size:11px;color:#ef4444;word-break:break-all"></div>
  <div class="msg" id="stat">加载中...</div>
  <div id="tbl" style="margin-top:8px"></div>
</div>
<script>
var VEXT = ['mp4','mkv','webm','avi','mov','flv','ts','m3u8','wmv','mpg','mpeg'];
var CWD = '/';
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fmtSize(n) { if (!n) return ''; var u = ['B','KB','MB','GB','TB'], i = 0; while (n >= 1024 && i < 4) { n = n / 1024; i++; } return (i ? n.toFixed(1) : n) + ' ' + u[i]; }
function toast(s, bad) { var st = document.getElementById('stat'); st.textContent = s; st.className = 'msg ' + (bad ? 'err' : 'ok'); }
function copyText(s, done) {
  function legacy() { var i = document.createElement('textarea'); i.value = s; document.body.appendChild(i); i.select(); try { document.execCommand('copy'); done(); } catch (e) {} document.body.removeChild(i); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(done, legacy); else legacy();
}
function extOf(n) { var i = String(n).lastIndexOf('.'); return i > 0 ? String(n).slice(i + 1).toLowerCase() : ''; }
function loadStatus() {
  fetch('/api/plugin/openlist/status').then(function (r) { return r.json(); }).then(function (d) {
    if (d.code !== 0 || !(d.data && d.data.configured)) {
      toast('未配置：请在后台 插件 → openlist 设置中填写 baseUrl' + (d.data && d.data.base ? '' : ''), true);
      return;
    }
    listPath('/', true);
  }).catch(function () { toast('加载失败', true); });
}
function listPath(p, fromPop) {
  CWD = p || '/';
  if (!fromPop) navPush(CWD);
  toast('加载中...');
  fetch('/api/plugin/openlist/list', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: CWD }) })
    .then(function (r) { return r.json(); }).then(function (d) {
      if (d.code !== 0) { toast(d.msg || '读取失败', true); return; }
      var parts = CWD.split('/').filter(Boolean);
      var cr = '<a data-p="/">/</a>';
      var acc = '';
      for (var i = 0; i < parts.length; i++) { acc += '/' + parts[i]; cr += ' <a data-p="' + esc(acc) + '">' + esc(parts[i]) + '</a> /'; }
      document.getElementById('crumbs').innerHTML = cr;
      var up = document.getElementById('upBtn');
      if (CWD && CWD !== '/') { up.style.display = ''; up.title = '返回 ' + parentPath(CWD); } else { up.style.display = 'none'; up.title = ''; }
      var rows = [];
      d.data.dirs.forEach(function (x) { rows.push('<tr><td class="name dir" data-d="' + esc(x.name) + '">📁 ' + esc(x.name) + '</td><td>—</td><td></td></tr>'); });
      d.data.files.forEach(function (x) {
        var e = extOf(x.name), v = VEXT.indexOf(e) >= 0;
        rows.push('<tr><td class="name">' + (v ? '🎬 ' : '📄 ') + esc(x.name) + (e ? ' <span class="vext">' + esc(e) + '</span>' : '') + '</td><td>' + fmtSize(x.size) + '</td>' +
          '<td>' + (v ? '<button data-l="' + esc(x.name) + '" data-act="play">播放链接</button><button data-l="' + esc(x.name) + '" data-act="reg">注册到库</button>' : '') + '</td></tr>');
      });
      document.getElementById('tbl').innerHTML = '<table><tr><th>名称</th><th>大小</th><th>操作</th></tr>' + rows.join('') + '</table>';
      toast('共 ' + d.data.dirs.length + ' 个目录 · ' + d.data.files.length + ' 个文件');
    }).catch(function () { toast('读取失败', true); });
}
function withLink(name, fn) {
  toast('获取链接中...');
  var p = (CWD === '/' ? '' : CWD) + '/' + name;
  fetch('/api/plugin/openlist/link', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: p }) })
    .then(function (r) { return r.json(); }).then(function (d) {
      if (d.code !== 0) { toast(d.msg || '获取链接失败', true); return null; }
      fn(d.data.link);
      return d.data.link;
    }).catch(function () { toast('获取链接失败', true); });
}
function parentPath(p) { var s = String(p || '/').replace(/\/+$/, ''); if (!s || s === '/') return '/'; var i = s.lastIndexOf('/'); return i <= 0 ? '/' : s.slice(0, i); }
function goUp() { if (CWD && CWD !== '/') listPath(parentPath(CWD)); }
function navPush(p) { try { history.pushState({ p: p }, '', location.pathname + '#p=' + encodeURIComponent(p)); } catch (e) {} }
window.addEventListener('popstate', function (e) {
  var p = (e.state && e.state.p) || (location.hash.indexOf('#p=') === 0 ? decodeURIComponent(location.hash.slice(3)) : '/');
  listPath(p, true);
});
document.getElementById('crumbs').addEventListener('click', function (e) {
  var a = e.target.closest('a'); if (!a) return; listPath(a.getAttribute('data-p'));
});
document.getElementById('tbl').addEventListener('click', function (e) {
  var b = e.target.closest('button');
  var d = e.target.closest('td.name');
  if (d && d.getAttribute('data-d')) { listPath((CWD === '/' ? '' : CWD) + '/' + d.getAttribute('data-d')); return; }
  if (!b) return;
  var name = b.getAttribute('data-l'), act = b.getAttribute('data-act');
  if (act === 'play') {
    withLink(name, function (link) {
      var full = location.origin + '/player/?url=' + encodeURIComponent(link);
      copyText(full, function () { toast('已复制播放链接，可直接分享/打开'); });
    });
  } else if (act === 'reg') {
    withLink(name, function (link) {
      fetch('/api/video/resolve?url=' + encodeURIComponent(link)).then(function (r) { return r.json(); }).then(function (d2) {
        if (d2.code === 0 && d2.data && d2.data.vid) toast('已注册 vid=' + d2.data.vid + '（若含内封字幕将自动提取，稍后弹窗提醒）');
        else toast(d2.msg || '注册失败', true);
      }).catch(function () { toast('注册失败', true); });
    });
  }
});
/* ── 整个文件夹扫描（含子目录）：后台任务 + 顶栏任务列表进度 ── */
var scanTimer = null;
var SCANST = {};
function scanStat(s, cls) { var el = document.getElementById('scanStat'); el.textContent = s || ''; el.className = 'msg ' + (cls || ''); }
function pollScan() {
  fetch('/api/plugin/openlist/scan/status').then(function (r) { return r.json(); }).then(function (d) {
    var s = (d && d.data) || {};
    SCANST = s;
    var btn = document.getElementById('scanBtn'), pb = document.getElementById('pauseBtn'), sb = document.getElementById('stopBtn');
    var rb = document.getElementById('retryBtn'), fl = document.getElementById('failList');
    if (s.scanning) {
      btn.disabled = true;
      pb.style.display = ''; sb.style.display = '';
      rb.style.display = 'none'; fl.style.display = 'none';
      pb.textContent = s.paused ? '继续' : '暂停';
      var retry = s.mode === 'retry';
      var base = (s.done || 0) + '/' + (s.total || '?') + (retry ? ' · 恢复 ' : ' · 成功 ') + (s.ok || 0) + (retry ? ' · 仍失败 ' : ' · 失败 ') + (s.fail || 0) + ' · 字幕 ' + (s.subs || 0);
      scanStat(s.paused ? '⏸ 已暂停 · ' + base : (retry ? '重试中 ' : '扫描中 ') + base + (s.lastFile ? ' · ' + s.lastFile : ''), 'warn');
      if (!scanTimer) scanTimer = setInterval(pollScan, 2000);
    } else {
      if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
      btn.disabled = false;
      pb.style.display = 'none'; sb.style.display = 'none';
      var fails = s.failed || [];
      if (fails.length) {
        rb.style.display = ''; rb.textContent = '重试失败项（' + fails.length + '）';
        fl.style.display = '';
        fl.textContent = '失败清单：' + fails.slice(0, 20).map(function (x) { return x.path + (x.why ? ' — ' + x.why : ''); }).join('；') + (fails.length > 20 ? '；…共 ' + fails.length + ' 个' : '');
      } else { rb.style.display = 'none'; fl.style.display = 'none'; }
      if (s.lastSummary) scanStat(s.lastSummary, (s.fail && !s.ok) ? 'err' : 'ok');
    }
  }).catch(function () {});
}
function scanControl(action) {
  fetch('/api/plugin/openlist/scan/control', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: action }) })
    .then(function (r) { return r.json(); }).then(function (d) {
      if (d.code !== 0) { scanStat(d.msg || '操作失败', 'err'); return; }
      pollScan();
    }).catch(function () { scanStat('操作失败', 'err'); });
}
function scanPauseToggle() { scanControl(SCANST.paused ? 'resume' : 'pause'); }
function scanFolder() {
  if (scanTimer) return;
  scanStat('正在启动扫描...', 'warn');
  fetch('/api/plugin/openlist/scan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: CWD }) })
    .then(function (r) { return r.json(); }).then(function (d) {
      if (d.code !== 0) { scanStat(d.msg || '启动失败', 'err'); return; }
      toast('后台扫描已启动：' + CWD + '（进度可在右上角任务列表查看）');
      pollScan();
      scanTimer = setInterval(pollScan, 2000);
    }).catch(function () { scanStat('启动失败', 'err'); });
}
function retryScan() {
  if (scanTimer) return;
  scanStat('正在启动重试...', 'warn');
  fetch('/api/plugin/openlist/scan/retry', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
    .then(function (r) { return r.json(); }).then(function (d) {
      if (d.code !== 0) { scanStat(d.msg || '启动失败', 'err'); return; }
      toast('失败重试已启动（' + ((d.data && d.data.count) || 0) + ' 个文件），进度可在右上角任务列表查看');
      pollScan();
      scanTimer = setInterval(pollScan, 2000);
    }).catch(function () { scanStat('启动失败', 'err'); });
}
pollScan();
loadStatus();
</script>
</body>
</html>
